plugins { id 'com.android.application' }

// Signing is an explicit release operation. Never silently publish with a newly
// generated debug identity; installed Fieldnote releases must remain upgradeable.
def releaseSigning = [
    storeFile: System.getenv('FIELDNOTE_KEYSTORE_PATH'),
    storePassword: System.getenv('FIELDNOTE_KEYSTORE_PASSWORD'),
    keyAlias: System.getenv('FIELDNOTE_KEY_ALIAS'),
    keyPassword: System.getenv('FIELDNOTE_KEY_PASSWORD')
]
def signingFieldsPresent = releaseSigning.values().count { it != null && !it.isEmpty() }
if (signingFieldsPresent != 0 && signingFieldsPresent != releaseSigning.size()) {
    throw new GradleException('Set all four FIELDNOTE signing environment variables, or none.')
}
def useExistingBetaKey = providers.gradleProperty('fieldnoteUseExistingBetaKey').orNull == 'true'
if (useExistingBetaKey && signingFieldsPresent != 0) {
    throw new GradleException('Choose configured release signing or the existing beta key, not both.')
}

android {
    namespace 'com.fieldnote.app'
    compileSdk 35
    defaultConfig {
        applicationId 'com.fieldnote.app'
        minSdk 26
        targetSdk 35
        versionCode 28
        versionName '1.1.0-beta.2'
        resValue 'string', 'app_version_label', "Fieldnote ${versionName}"
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    signingConfigs {
        if (signingFieldsPresent == releaseSigning.size()) {
            release {
                storeFile file(releaseSigning.storeFile)
                storePassword releaseSigning.storePassword
                keyAlias releaseSigning.keyAlias
                keyPassword releaseSigning.keyPassword
            }
        }
    }
    buildTypes {
        debug { applicationIdSuffix '' }
        release {
            minifyEnabled false
            if (signingFieldsPresent == releaseSigning.size()) {
                signingConfig signingConfigs.release
            } else if (useExistingBetaKey) {
                if (!signingConfigs.debug.storeFile.isFile()) {
                    throw new GradleException('The existing beta keystore is missing; refusing to generate a replacement release identity.')
                }
                signingConfig signingConfigs.debug
            }
        }
    }
    lint { abortOnError true }
}

configurations {
    speechModel {
        canBeConsumed = false
        transitive = false
    }
}

dependencies {
    implementation project(':watchlink')
    implementation 'com.alphacephei:vosk-android:0.3.75'
    speechModel 'com.alphacephei.model:vosk-model-small-en-us:0.15@zip'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}

abstract class StageSpeechModel extends DefaultTask {
    @javax.inject.Inject
    abstract ArchiveOperations getArchiveOperations()

    @javax.inject.Inject
    abstract FileSystemOperations getFileSystemOperations()

    @InputFiles
    @PathSensitive(PathSensitivity.NONE)
    abstract ConfigurableFileCollection getArchives()

    @OutputDirectory
    abstract DirectoryProperty getAssetsDirectory()

    @TaskAction
    void stage() {
        def model = archives.singleFile
        def digest = java.security.MessageDigest.getInstance('SHA-256')
        new java.security.DigestInputStream(model.newInputStream(), digest).withCloseable {
            it.transferTo(OutputStream.nullOutputStream())
        }
        if (digest.digest().encodeHex().toString() != '30f26242c4eb449f948e42cb302dd7a686cb29a3423a8367f99ff41780942498') {
            throw new GradleException('The downloaded Vosk speech model failed SHA-256 verification.')
        }
        fileSystemOperations.sync {
            from(archiveOperations.zipTree(model)) {
                eachFile { details ->
                    def segments = details.relativePath.segments.toList()
                    if (segments.size() < 2 || segments[0] != 'vosk-model-small-en-us-0.15'
                            || segments.any { it in ['', '.', '..'] || it.contains('\\') || it.contains(':') }) {
                        throw new GradleException('The Vosk speech model archive has an unexpected path.')
                    }
                    details.relativePath = new RelativePath(true,
                            (['offline-speech-model'] + segments.drop(1)) as String[])
                }
                includeEmptyDirs = false
            }
            into assetsDirectory
        }
    }
}

androidComponents {
    onVariants(selector().all()) { variant ->
        def stageModel = tasks.register("stage${variant.name.capitalize()}SpeechModel", StageSpeechModel) {
            archives.from(configurations.speechModel)
        }
        variant.sources.assets.addGeneratedSourceDirectory(stageModel) { it.assetsDirectory }
    }
}
